plugins {
    id 'com.android.application'
}

android {
    namespace = 'org.pocketworkstation.pckeyboard'
    compileSdk = 36
    ndkVersion = '29.0.14206865'

    defaultConfig {
        applicationId = 'org.pocketworkstation.pckeyboard'
        minSdk = 21
        targetSdk = 36
        versionCode = 1041009
        versionName = 'v1.41.1-modern.8'

    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path = file('CMakeLists.txt')
            version = '3.31.6'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig = true
    }

    lint {
        checkReleaseBuilds = false
        // The upstream project intentionally ships many partial legacy translations.
        disable += ['MissingTranslation', 'ExtraTranslation', 'ResAuto', 'NamespaceTypo']
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    testImplementation 'junit:junit:4.13.2'
}
